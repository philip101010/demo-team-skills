<title>Demo Team Roster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: masthead (title, Watching / Stopped switch) over a desk of project files; each file is a paper form holding one tile per agent.
   Look: the Quest Board's Papers, Please desk: olive-black with faint scanlines, bone lines, amber accent, system font, bright paper forms with form headers, labelled fields and stamps.
   The agents themselves are the widget's pixel knights, unchanged. */
:root{
  --bg:#11150F; --bg-glow:#1D251A; --ink:#E4E0C6; --muted:#9AA086; --paper:#1B2117; --doc:#232B1E;
  --accent:#E8A33D; --on-accent:#11150F; --line:#4A5236; --shadow:#050703;
  --hi:rgba(228,224,198,.2); --lo:rgba(0,0,0,.5); --scan:rgba(0,0,0,.3);
  --red:#C93B2C; --on-red:#FFF1E2; --green:#6FA84A; --on-green:#12200A; --stamp-ok:#8FD67A; --stamp-bad:#FF7A6B; --blend:normal;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#E7D9BF; --bg-glow:#F6EEDC; --ink:#2A1620; --muted:#7A6A5C; --paper:#FBF5E6; --doc:#EFE6C8;
  --accent:#E8A33D; --on-accent:#2A1620; --line:#B9A88B; --shadow:#2A1620;
  --hi:rgba(255,255,255,.6); --lo:rgba(42,22,32,.3); --scan:rgba(42,22,32,.07);
  --stamp-ok:#2F6B2A; --stamp-bad:#B3261E; --blend:multiply; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#E7D9BF; --bg-glow:#F6EEDC; --ink:#2A1620; --muted:#7A6A5C; --paper:#FBF5E6; --doc:#EFE6C8;
  --accent:#E8A33D; --on-accent:#2A1620; --line:#B9A88B; --shadow:#2A1620;
  --hi:rgba(255,255,255,.6); --lo:rgba(42,22,32,.3); --scan:rgba(42,22,32,.07);
  --stamp-ok:#2F6B2A; --stamp-bad:#B3261E; --blend:multiply; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);background-image:radial-gradient(ellipse 80% 60% at 50% 25%,var(--bg-glow) 0,var(--bg) 70%);background-attachment:fixed;
  color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:49;pointer-events:none;background:repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 3px);opacity:.55}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.page{max-width:1000px;margin:0 auto;display:grid;gap:20px;position:relative;z-index:1}

.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 12px}
.sw{position:relative;display:grid;grid-template-columns:1fr 1fr;min-width:230px;padding:0;font-weight:600;font-size:15px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.sw .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);background:var(--accent);border:2px solid var(--ink);transition:transform .15s steps(3)}
.sw.on .thumb{transform:translateX(100%)}
.sw .opt{position:relative;z-index:1;padding:6px 12px;text-align:center}
.sw .opt span{margin-left:6px;opacity:.8}
.sw:not(.on) .opt-a,.sw.on .opt-b{color:var(--on-accent)}
.top .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stampline.live{color:var(--stamp-ok)}
.stampline{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.btn{font-weight:600;font-size:14px;padding:5px 12px;background:var(--paper);border:2px solid var(--ink);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo),3px 3px 0 var(--shadow)}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translate(2px,2px);box-shadow:inset -2px -2px 0 var(--hi),inset 2px 2px 0 var(--lo),1px 1px 0 var(--shadow)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--ink)}

.file{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo),5px 5px 0 var(--shadow);padding:12px;display:grid;gap:12px;min-width:0}
.file+.file{margin-top:4px}
.fname{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.fname h2{margin:0;font-size:19px;font-weight:700;text-wrap:balance}
.fname .meta{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fname .right{display:flex;align-items:center;gap:10px}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:20px 28px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px 24px;align-content:start}
.m{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;padding:2px 0 2px 8px;border-left:3px solid transparent;min-width:0}
.m.orch{border-left-color:var(--accent)}
.m.orch .nm{color:var(--accent)}
.mb{min-width:0;display:grid;gap:3px}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-weight:700;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12px;color:var(--muted);white-space:nowrap}
.st.on{color:var(--stamp-ok)} .st.bad{color:var(--stamp-bad)}
.task{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.on{color:var(--ink)}
.prog{display:grid;grid-template-columns:minmax(0,1fr) 4ch;gap:8px;align-items:center}
.barbox{height:4px;overflow:hidden}
.barbox svg{display:block;width:100%;height:100%}
.pctn{font-size:11px;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.times{font-size:12px;color:var(--muted);min-height:16px;display:flex;justify-content:space-between;gap:8px}
.times span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.road{display:grid;gap:8px;min-width:0;align-content:start}
.road h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px dotted var(--muted);padding-bottom:3px}
.rsum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.rbar{height:4px;background:var(--line);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--stamp-ok)}
.t{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;padding:5px 0 5px 8px;border-left:3px solid var(--line);font-size:14px}
.t.s-working{border-left-color:var(--stamp-ok)} .t.s-paused{border-left-color:var(--stamp-bad)} .t.s-done{opacity:.6}
.tid{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);align-self:baseline;white-space:nowrap}
.tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{grid-column:2;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.road details summary{cursor:pointer;font-size:12px;color:var(--muted);padding:4px 0}
.road details[open] summary{margin-bottom:2px}
.none{font-size:13px;color:var(--muted)}
.stop{font-size:13px;padding:3px 10px;color:var(--muted);border:2px solid var(--line);background:transparent}
.stop:hover{color:var(--ink);border-color:var(--ink)}
.empty{text-align:center;padding:28px 16px;background:var(--paper);border:3px dashed var(--ink)}
.empty .big{font-size:20px;font-weight:700;margin:0 0 4px}
.empty p{margin:4px 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sw .thumb{transition:none}}
</style>
<div class="page">
  <header class="top">
    <button class="sw" id="sw" type="button" role="switch" aria-checked="false" aria-label="Show projects you stopped watching"><span class="thumb"></span><span class="opt opt-a">Watching<span id="nWatch">0</span></span><span class="opt opt-b">Stopped<span id="nStop">0</span></span></button>
    <span class="right"><span class="stampline" id="stamp">no snapshot yet</span><button class="btn" id="live" type="button" hidden>Go live</button></span>
  </header>
  <main id="main"></main>
</div>
<script>
/*SPRITES*/
(function(){
  var projects = {}, db = null, showStopped = false, mcp = null;
  var live = {}, liveOn = false, liveTimer = null, liveErr = '', liveAt = 0, lastSnap = '', doneOpen = {};
  var $ = function(id){return document.getElementById(id)};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
  function ago(t){ if(!t) return 'never'; var m=Math.round((Date.now()-t)/60000); return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'; }
  function formNo(id){ var n=0; for(var k=0;k<id.length;k++) n+=id.charCodeAt(k)*(k+3); return 'A-'+(1000+n%9000); }
  function norm(m){ return { id:m.id, name:m.name, cls:m.cls, state:m.state, isBlocked:!!m.blocked, task:m.task||undefined,
    note:m.note||undefined, done:m.done==null?undefined:m.done, total:m.total==null?undefined:m.total,
    elapsedMs:m.elapsedMs==null?undefined:m.elapsedMs, etaMs:m.etaMs==null?undefined:m.etaMs, role:m.role }; }
  function memberHtml(raw){
    var m = norm(raw), run = m.state==='working';
    var task = (m.task && m.task!==m.name) ? m.task : (run ? 'working…' : 'no task');
    var stClass = run ? 'on' : m.isBlocked ? 'bad' : '';
    return '<div class="m'+(m.role==='orchestrator'?' orch':'')+'"><div class="spr">'+spriteSvg(m,44,40)+'</div><div class="mb">'+
      '<div class="r1"><span class="nm">'+esc(m.name)+'</span><span class="st '+stClass+'">'+esc(statusOf(m))+'</span></div>'+
      '<div class="task'+(run?' on':'')+'" title="'+esc(task)+'">'+esc(task)+'</div>'+
      '<div class="prog"><div class="barbox">'+barSvg(m)+'</div><div class="pctn">'+esc(pctOf(m))+'</div></div>'+
      '<div class="times"><span>'+esc(m.note||'')+'</span><span>'+esc(timesOf(m))+'</span></div></div></div>';
  }
  var RANK = {working:0, paused:1, queued:2, unknown:3, done:4};
  function taskHtml(t){
    var meta=[t.performer, t.priority, t.depends?'after '+t.depends:''].filter(Boolean).join(' · ');
    return '<div class="t s-'+esc(t.status)+'"><span class="tid">'+esc(t.id)+'</span><span class="tt" title="'+esc(t.title)+'">'+esc(t.title)+'</span>'+(meta?'<span class="tm">'+esc(meta)+'</span>':'')+'</div>';
  }
  function roadHtml(p){
    var ts=(p.tasks||[]).slice();
    if(!ts.length) return '<div class="road"><h3>Roadmap</h3><div class="none">No task files yet.</div></div>';
    ts.sort(function(a,b){ return (RANK[a.status]||0)-(RANK[b.status]||0) || (a.priority||'Z').localeCompare(b.priority||'Z'); });
    var done=ts.filter(function(t){return t.status==='done'}), open=ts.filter(function(t){return t.status!=='done'});
    var pc=Math.round(done.length/ts.length*100);
    return '<div class="road"><h3>Roadmap</h3><div class="rsum"><div class="rbar"><i style="width:'+Math.max(2,pc)+'%"></i></div><span>'+done.length+' of '+ts.length+' done</span></div>'+
      (open.length? open.map(taskHtml).join('') : '<div class="none">Everything is done.</div>')+
      (done.length? '<details data-slug="'+esc(p.slug)+'"'+(doneOpen[p.slug]?' open':'')+'><summary>'+done.length+' done</summary>'+done.map(taskHtml).join('')+'</details>' : '')+'</div>';
  }
  function setWatching(slug,on){ if(db) db.doc('projects/'+slug).update({watching:on}).catch(function(){}); }
  function render(){
    var list = Object.keys(projects).map(function(k){
      var d = projects[k], l = liveOn && !liveErr && live[d.slug];
      return l ? Object.assign({}, l, {watching: d.watching, generatedAt: liveAt}) : d;
    }).sort(function(a,b){return b.working-a.working||a.name.localeCompare(b.name)});
    var watched=list.filter(function(p){return p.watching!==false}), stopped=list.filter(function(p){return p.watching===false});
    $('nWatch').textContent=watched.length; $('nStop').textContent=stopped.length;
    $('sw').classList.toggle('on',showStopped); $('sw').setAttribute('aria-checked',String(showStopped));
    var newest=0; watched.forEach(function(p){newest=Math.max(newest,p.generatedAt||0)});
    var st = $('stamp');
    st.className = 'stampline' + (liveOn && !liveErr ? ' live' : '');
    st.textContent = liveOn && !liveErr && liveAt ? 'live \u00b7 '+ago(liveAt)
      : liveOn && liveErr ? 'snapshot \u00b7 live off ('+liveErr+')'
      : newest ? 'snapshot \u00b7 '+ago(newest) : 'no snapshot yet';
    $('live').hidden = !mcp;
    $('live').textContent = liveOn && !liveErr ? 'Stop live' : liveOn ? 'Retry live' : 'Go live';
    var shown = showStopped ? stopped : watched, out='';
    if(!shown.length){
      out = '<div class="empty"><p class="big">'+(showStopped?'Nothing stopped':'No project files')+'</p><p>'+
        (showStopped?'Projects you stop watching wait here until you resume them.':'Ask Claude to refresh the roster.')+'</p></div>';
    }
    shown.forEach(function(p){
      out += '<section class="file" data-slug="'+esc(p.slug)+'"><div class="fname"><div><h2>'+esc(p.name)+'</h2><div class="meta">'+
        p.working+' of '+p.members.length+' working · updated '+ago(p.generatedAt)+'</div></div><div class="right">'+
        '<button class="btn stop" type="button" data-act="'+(showStopped?'resume':'stop')+'">'+(showStopped?'Resume watching':'Stop watching')+'</button></div></div>'+
        (showStopped ? '' : '<div class="cols"><div class="members">'+p.members.map(memberHtml).join('')+'</div>'+roadHtml(p)+'</div>')+'</section>';
    });
    $('main').innerHTML = out;
  }
  $('sw').onclick=function(){ showStopped=!showStopped; render(); };
  $('main').addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b) return; var f=b.closest('[data-slug]'); if(!f) return;
    setWatching(f.getAttribute('data-slug'), b.getAttribute('data-act')==='resume');
  });
  function snapOf(res){
    var v = res && res.payload;
    if (typeof v === 'string') { try { v = JSON.parse(v); } catch (e) { v = null; } }
    if (!v && res && res.content) {
      for (var i = 0; i < res.content.length && !v; i++) { try { v = JSON.parse(res.content[i].text); } catch (e) { v = null; } }
    }
    return v && v.projects ? v : null;
  }
  function pollLive(){
    if (!mcp) return;
    mcp.callTool('host:demo-team-roster', 'team_snapshot', {}).then(function(res){
      var snap = snapOf(res);
      if (!snap) { liveErr = 'unreadable reply'; render(); return; }
      liveErr = ''; liveAt = snap.generatedAt || Date.now();
      var key = JSON.stringify(snap.projects.map(function(p){ return [p.slug, p.members, p.tasks]; }));
      if (key === lastSnap && !liveErr) { render(); return; }
      lastSnap = key; live = {}; snap.projects.forEach(function(p){ live[p.slug] = p; }); render();
    }).catch(function(e){
      liveErr = (e && e.code) || 'error';
      if (/not_granted|cancelled|denied|not_connected|unavailable/.test(liveErr)) stopLive(true);
      render();
    });
  }
  function startLive(){
    if (liveOn) return; liveOn = true; liveErr = '';
    try { localStorage.setItem('live', '1'); } catch (e) {}
    pollLive(); liveTimer = setInterval(pollLive, 5000); render();
  }
  function stopLive(keepError){
    liveOn = keepError ? liveOn : false; clearInterval(liveTimer); liveTimer = null;
    if (!keepError) { try { localStorage.setItem('live', '0'); } catch (e) {} }
    render();
  }
  $('live').onclick = function(){ if (liveOn && !liveErr) stopLive(false); else { liveOn = false; startLive(); } };
  $('main').addEventListener('toggle', function(e){
    var d = e.target; if (d && d.tagName === 'DETAILS') doneOpen[d.getAttribute('data-slug')] = d.open;
  }, true);
  window.claude.use('mcp').then(function(m){
    if (!m) return; mcp = m;
    try { if (localStorage.getItem('live') === '1') startLive(); } catch (e) {}
    render();
  });
  window.claude.use('db').then(function(d){
    if(!d) return; db=d;
    db.collection('projects').onSnapshot(function(snap){
      projects={}; snap.docs.forEach(function(x){ projects[x.id]=x.data(); }); render();
    });
  });
  render();
  setInterval(render,30000);
})();
</script>
